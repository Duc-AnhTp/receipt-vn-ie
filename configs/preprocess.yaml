# Cấu hình tiền xử lý ảnh và tăng cường dữ liệu (Augmentation)
image:
  default_profile: "resize"
  donut:
    max_size: [1280, 960]
    keep_aspect_ratio: true
  ocr:
    profile: "resize"
    max_long_side: 1600
    max_side: 1600
    rectify: false
    binarize: false
    denoise: true  # NOT IMPLEMENTED — pipeline không đọc flag này
    clahe: true  # NOT IMPLEMENTED — pipeline không đọc flag này

augmentation:
  rotate:
    limit: 2
    p: 0.4
  brightness_contrast:
    brightness_limit: 0.2
    contrast_limit: 0.2
    p: 0.4
  compression:
    quality_range: [60, 100]
    p: 0.3
  blur:
    blur_limit: [3, 3]
    p: 0.15
  perspective:
    scale: [0.01, 0.03]
    p: 0.2
