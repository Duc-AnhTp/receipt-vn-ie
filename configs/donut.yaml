# Cấu hình huấn luyện và sinh chuỗi của Donut
# Main run dùng mode=finetune trên dữ liệu tiếng Việt. CORD warm-up là optional/future work.
model:
  name: "naver-clova-ix/donut-base"
  task_token: "<s_receipt_ie>"
  cord_task_token: "<s_cord_receipt_parse>"
  max_length: 768
  image_size: [1280, 960]

training:
  output_dir: "checkpoints/donut/receipt_ie"
  epochs: 250
  # Chỉ dùng khi chạy optional mode=warmup/full với CORD v2.
  warmup_epochs: 10
  train_batch_size: 8
  eval_batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  lr_scheduler_type: "cosine"
  fp16: true
  gradient_checkpointing: true
  logging_steps: 20
  eval_steps: 200
  save_steps: 200
  save_total_limit: 3
  early_stopping_patience: 15

generation:
  max_length: 768
  num_beams: 2
  early_stopping: true
